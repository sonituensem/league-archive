<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        League Archive
        {% endblock %}
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >


    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >



<style>


:root {

    --gold: #c8aa6e;

}



* {

    box-sizing: border-box;

}



body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #222,
            #080808 70%
        );

    color:white;

    font-family:"Inter", sans-serif;

}



h1,
h2,
h3,
h4 {

    font-family:"Cinzel", serif;

}




.navbar-brand {

    font-family:"Cinzel", serif;

    font-weight:800;

    letter-spacing:3px;

    color:var(--gold)!important;

}




/*
    LIST CARDS
*/


.champion-card {

    position:relative;

    overflow:hidden;

    border-radius:15px;

    background:#000;

    border:
        1px solid rgba(200,170,110,.3);

    transition:.3s;

}



.champion-card:hover {

    transform:translateY(-8px);

    border-color:var(--gold);

    box-shadow:
        0 0 30px rgba(200,170,110,.3);

}



.card-img-top {


    width:100%;

    height:450px;

    object-fit:cover;

    object-position:center center;

    transition:.5s;

}



.champion-card:hover .card-img-top {

    transform:scale(1.05);

}





.champion-overlay {


    position:absolute;

    bottom:0;

    left:0;

    width:100%;


    padding:
        80px 20px 30px;


    text-align:center;


    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.9)
        );

}



.champion-overlay h3 {

    color:white;

    font-size:32px;

}



.champion-overlay p {

    color:var(--gold);

}







/*
 DETAIL
*/


.champion-hero {

    position:relative;

    overflow:hidden;

    border-radius:20px;

}



.champion-detail-image {


    width:100%;

    height:650px;

    object-fit:cover;

    object-position:var(--image-position, center center);

}




.champion-hero-overlay {


    position:absolute;

    bottom:0;

    width:100%;

    padding:
        120px 30px 50px;


    text-align:center;


    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.9)
        );

}



.champion-hero-overlay h1 {


    font-size:70px;

    text-shadow:
        0 0 20px var(--gold);

}



.champion-hero-overlay h3 {

    color:var(--gold);

}







/*
 DIFFICULTY
*/


.difficulty-bar {

    width:100%;

    height:12px;

    background:#333;

    border-radius:10px;

    overflow:hidden;

}



.difficulty-progress {


    height:100%;


    background:
        linear-gradient(
            90deg,
            #c8aa6e,
            #ffe08a
        );

}




/*
 ROLES
*/


.role-item {


    display:inline-flex;

    align-items:center;

    gap:10px;


    padding:10px 20px;


    margin:5px;


    border-radius:20px;


    border:1px solid var(--gold);


    color:var(--gold);

}



.role-icon {


    width:35px;

    height:35px;

    object-fit:contain;

}




/*
 RELATED
*/


.related-card {


    overflow:hidden;

    border-radius:15px;

    border:
        1px solid rgba(255,255,255,.1);

    transition:.3s;

}



.related-card:hover {


    transform:translateY(-5px);

    border-color:var(--gold);

}



.related-card img {


    width:100%;

    height:250px;

    object-fit:cover;

}



.champion-description {


    max-width:900px;

    margin:auto;

    text-align:center;

    color:#ddd;

    font-size:20px;

    line-height:1.8;

}


</style>



</head>



<body>


<nav class="navbar navbar-dark bg-black">

    <div class="container">

        <a
            class="navbar-brand"
            href="/"
        >

            League Archive

        </a>

    </div>

</nav>



<main class="container py-4">


{% block content %}

{% endblock %}


</main>



</body>

</html>
