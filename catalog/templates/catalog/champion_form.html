{% extends "catalog/base.html" %}


{% block title %}
Champion Form
{% endblock %}



{% block content %}


<div class="form-card">


    <h1 class="mb-4 text-center">
        Champion Form
    </h1>



    <form
        method="post"
        enctype="multipart/form-data"
    >


        {% csrf_token %}



        {% for field in form %}


        <div class="mb-3">


            <label
                class="form-label"
                for="{{ field.id_for_label }}"
            >

                {{ field.label }}

            </label>



            {{ field }}



            {% if field.errors %}


            <div class="text-danger mt-1">

                {{ field.errors }}

            </div>


            {% endif %}



        </div>


        {% endfor %}





        <div class="d-flex justify-content-between mt-4">


            <a
                href="{% url 'champion-list' %}"
                class="btn btn-outline-warning"
            >

                Cancel

            </a>



            <button
                type="submit"
                class="btn btn-warning"
            >

                Save Champion

            </button>


        </div>



    </form>


</div>



{% endblock %}
