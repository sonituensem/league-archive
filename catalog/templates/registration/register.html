{% extends "catalog/base.html" %}


{% block title %}
Register
{% endblock %}



{% block content %}

<div class="container mt-4">


    <h1 class="mb-4">
        Register
    </h1>


    <form method="post">

        {% csrf_token %}


        {{ form.as_p }}


        <button
            type="submit"
            class="btn btn-success"
        >
            Create account
        </button>


    </form>


</div>


{% endblock %}
