{% extends "catalog/base.html" %}

{% block content %}

<div class="container mt-4">

    <h1 class="mb-4">
        Champion form
    </h1>

    <form method="post" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn btn-primary"
        >
            Save
        </button>

        <a
            href="{% url 'champion-list' %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
