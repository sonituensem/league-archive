<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        League Archive
        {% endblock %}
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >


    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >



<style>


:root {

    --gold:#c8aa6e;

}



* {

    box-sizing:border-box;

}



body {

    min-height:100vh;

    background:
        radial-gradient(
            circle at top,
            #222,
            #080808 70%
        );

    color:white;

    font-family:"Inter", sans-serif;

}



h1,
h2,
h3,
h4 {

    font-family:"Cinzel", serif;

}





.navbar-brand {

    font-family:"Cinzel", serif;

    font-weight:800;

    letter-spacing:3px;

    color:var(--gold)!important;

}





.navbar .btn-warning {

    background-color:var(--gold);

    border-color:var(--gold);

    color:#000;

}



.navbar .btn-warning:hover {

    background-color:#ffe08a;

    border-color:#ffe08a;

}





/*
    CHAMPION CARDS
*/


.champion-card {

    position:relative;

    overflow:hidden;

    border-radius:15px;

    background:#000;

    border:
        1px solid rgba(200,170,110,.3);

    transition:.3s;

}



.champion-card:hover {

    transform:translateY(-8px);

    border-color:var(--gold);

    box-shadow:
        0 0 30px rgba(200,170,110,.3);

}



.card-img-top {

    width:100%;

    height:450px;

    object-fit:cover;

    transition:.5s;

}



.champion-card:hover .card-img-top {

    transform:scale(1.05);

}





.champion-overlay {

    position:absolute;

    bottom:0;

    width:100%;

    padding:80px 20px 30px;

    text-align:center;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.9)
        );

}



.champion-overlay h3 {

    color:white;

    font-size:32px;

}



.champion-overlay p {

    color:var(--gold);

}





/*
    DETAIL
*/


.champion-hero {

    position:relative;

    overflow:hidden;

    border-radius:20px;

}



.champion-detail-image {

    width:100%;

    height:650px;

    object-fit:cover;

    object-position:var(--image-position, center center);

}





.champion-hero-overlay {

    position:absolute;

    bottom:0;

    width:100%;

    padding:120px 30px 50px;

    text-align:center;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.9)
        );

}



.champion-hero-overlay h1 {

    font-size:70px;

    text-shadow:
        0 0 20px var(--gold);

}



.champion-hero-overlay h3 {

    color:var(--gold);

}





/*
    FORMS
*/


.champion-form-container {

    max-width:900px;

    margin:40px auto;

    padding:40px;

    background:
        rgba(0,0,0,.8);

    border:
        1px solid rgba(200,170,110,.5);

    border-radius:20px;

}



.champion-form-container label {

    color:var(--gold);

    font-family:"Cinzel", serif;

    font-weight:700;

}





.form-control,
.form-select,
input,
textarea,
select {


    background-color:#111 !important;

    color:white !important;

    border:
        1px solid rgba(200,170,110,.4) !important;

    border-radius:10px !important;

    padding:12px !important;

}



.form-control::placeholder {

    color:#777;

}



.form-control:focus,
.form-select:focus,
input:focus,
textarea:focus,
select:focus {


    background-color:#111 !important;

    color:white !important;

    border-color:var(--gold) !important;

    box-shadow:
        0 0 15px rgba(200,170,110,.35) !important;

}



select option {

    background:#111;

    color:white;

}



textarea {

    min-height:150px;

}



.champion-form-container .btn-warning {

    background:var(--gold);

    border-color:var(--gold);

    color:#000;

    font-weight:700;

}





/*
    ROLES
*/


.role-item {

    display:inline-flex;

    align-items:center;

    gap:10px;

    padding:10px 20px;

    margin:5px;

    border-radius:20px;

    border:1px solid var(--gold);

    color:var(--gold);

}



.role-icon {

    width:35px;

    height:35px;

    object-fit:contain;

}





.champion-description {

    max-width:900px;

    margin:auto;

    text-align:center;

    color:#ddd;

    font-size:20px;

    line-height:1.8;

}


</style>



</head>



<body>



<nav class="navbar navbar-dark bg-black">


<div class="container">


<a
    class="navbar-brand"
    href="{% url 'champion-list' %}"
>

League Archive

</a>



<div class="d-flex align-items-center">


{% if user.is_authenticated %}


<span class="text-light me-3">

{{ user.username }}

</span>



<form
    method="post"
    action="{% url 'logout' %}"
>

{% csrf_token %}


<button
    type="submit"
    class="btn btn-outline-danger"
>

Logout

</button>


</form>



{% else %}



<a
    href="{% url 'login' %}"
    class="btn btn-outline-light me-2"
>

Login

</a>



<a
    href="{% url 'register' %}"
    class="btn btn-warning"
>

Register

</a>



{% endif %}



</div>


</div>


</nav>





<main class="container py-4">


{% if messages %}

    {% for message in messages %}

        <div
            class="alert alert-success alert-dismissible fade show"
            role="alert"
        >

            {{ message }}


            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close"
            ></button>


        </div>

    {% endfor %}

{% endif %}



{% block content %}

{% endblock %}


</main>





<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



</body>

</html>
